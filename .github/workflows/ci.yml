name: ci
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        py: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      # Windows 的 `cc` 是 clang -> MSVC 目标，两个坑（Linux 腿都没有，所以只有 Windows 红）：
      #   1) 不认 -fPIC（已在 ops_cpu._compile 里按平台分派 + 回退）
      #   2) 产物**没有导出表**，ctypes 找不到插件函数
      #      （已在 ops_cpu.find_compiler 里改为：Windows 上若有 ziglang 就避开 clang）
      # 这一步只是双保险，且**不能因为它让整个 job 失败**：拿不到 zig 就什么都不做。
      - name: report the Windows C toolchain (best effort)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $z = $null
          try {
            $z = python -c "import os,ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), 'zig.exe'))"
          } catch {
            Write-Host "ziglang 不可用，按 PATH 选择编译器"
          }
          if ($z -and (Test-Path $z)) {
            Write-Host "pinning TGAI_CC=$z"
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TGAI_CC=$z`n")
          }
      - name: "test (no GPU; CUDA 用例会被 skipif 跳过)"
        # ★ 用仓库内脚本而不是 shell 管道：跨平台（Linux bash / Windows pwsh 都不依赖），
        #   并把失败用例名写进 Job Summary —— 否则"哪条测试红的"只能靠截图猜
        #   （公开仓库的 actions logs API 也返 403，2026-11-21 连续踩了三次）。
        run: python scripts/ci_test.py
